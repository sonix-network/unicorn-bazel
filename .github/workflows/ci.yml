name: Unicorn module

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: ubuntu-24.04, workspace: dev}
          - {host: ubuntu-24.04, workspace: dev/bcr}
          - {host: ubuntu-24.04-arm, workspace: dev/bcr}
          - {host: macos-15, workspace: dev/bcr}
          - {host: macos-15-intel, workspace: dev/bcr}
          # The runner's Visual Studio supplies MSVC, as on the BCR's Windows workers.
          - {host: windows-2025, workspace: dev/bcr}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check overlay pins
        run: python3 dev/tools/pin_sources.py --check
        if: runner.os != 'Windows'
      - name: Build all variants and run the upstream unit tests
        working-directory: ${{ matrix.workspace }}
        run: bazelisk test --test_output=errors @unicorn//:all
